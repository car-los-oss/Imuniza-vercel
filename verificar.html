<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprovante de vacinação · Imuniza</title>
<meta name="description" content="Comprovante de vacinação emitido pelo Imuniza.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2e1ae6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">

<body data-pagina="verificar">

<main class="comprovante">

  <header class="comprovante__topo">
    <div class="marca">
      <img class="marca__simbolo" src="assets/img/logo-icone.png" alt="" width="44" height="44">
      <span class="marca__textos">
        <span class="marca__nome">imuniza</span>
        <span class="marca__linha">Comprovante de vacinação</span>
      </span>

    <button class="btn btn--primario btn--pequeno comprovante__imprimir oculto" type="button" id="imprimir">
      Imprimir ou salvar em PDF
    </button>

  <div id="comprovante" aria-live="polite"><p class="lista-vazia">Carregando comprovante...</p></div>

  <p class="comprovante__rodape">
    Documento gerado a partir dos registros das unidades de saúde cadastradas no Imuniza.

<script src="assets/js/app.js"></script>
